services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - opspilot_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 12

  resolution:
    build:
      context: .
      dockerfile: Dockerfile.resolution
    restart: unless-stopped
    environment:
      NODE_ENV: production
      MODEL_API_TOKEN: ${MODEL_API_TOKEN:?Set MODEL_API_TOKEN in .env}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 15s
      timeout: 7s
      retries: 12
      start_period: 90s

  delayrisk:
    build:
      context: .
      dockerfile: Dockerfile.delayrisk
    restart: unless-stopped
    environment:
      NODE_ENV: production
      MODEL_API_TOKEN: ${MODEL_API_TOKEN:?Set MODEL_API_TOKEN in .env}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5)"]
      interval: 15s
      timeout: 7s
      retries: 12
      start_period: 90s

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      CLIENT_ORIGIN: http://localhost:8080
      COOKIE_SECURE: "false"
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/opspilot_ai}
      ML_SERVICE_URL: http://resolution:8000
      DELAY_RISK_SERVICE_URL: http://delayrisk:8001
      MODEL_API_TOKEN: ${MODEL_API_TOKEN:?Set MODEL_API_TOKEN in .env}
    depends_on:
      mongo:
        condition: service_healthy
      resolution:
        condition: service_healthy
      delayrisk:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  opspilot_mongo_data:
